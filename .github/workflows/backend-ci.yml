name: Backend CI

on:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  push:
    branches: [backend, main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Unit and flow tests
        run: pnpm test
      - name: Database migrations and row-level security tests
        run: (psql --version || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)) && pnpm --filter @mgc/db test:sql
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
