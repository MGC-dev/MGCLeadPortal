name: Publish showcase site

on:
  push:
    branches: [showcase/mgc-crm-demo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: showcase-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # node_modules in the repo was installed on a Mac; reinstall for Linux.
      - run: rm -rf node_modules && npm install --no-audit --no-fund
      - run: scripts/build-showcase-site.sh "/${{ github.event.repository.name }}/"
      - name: Push to gh-pages
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish showcase from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
