# Local stack for the backend: Redis for the job queues.
# Supabase runs separately through its CLI (pnpm --filter @mgc/db db:start), which brings its own containers.
#
#   pnpm stack:up      start it
#   pnpm stack:down    stop it
name: mgc-crm

services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  redis-data:
