<style>
/* Layout: Apple-style app shell. Translucent sidebar (desktop) or tab bar (phone) as the functional layer, a glass toolbar with a large title, grouped content on a grouped background. Lead details open as an inspector on desktop and a bottom sheet on phones. Light and dark follow the system. */
:root {
  color-scheme: light;
  --bg: #F1F5F7; --surface: #FFFFFF; --fill: #E4EBEE; --fill-2: #F1F5F7;
  --label: #1C1C1E; --label-2: #5C5C61; --label-3: #8E8E93;
  --separator: #C6C6C8; --separator-soft: #E0E0E4;

  --green: #17702F; --green-soft: #E2F3E6; --switch-on: #248A3D;
  --orange: #B04A0A; --orange-soft: #FDE9DC;
  --red: #C0261C; --red-soft: #FBE6E4; --red-ink: #FFFFFF;
  --sms: #34C759; --sms-ink: #FFFFFF; --sms-in: #E9E9EB;
  --side-bg: #1A3340; --side-fg: #F1F6F8; --side-text: rgba(230, 238, 241, 0.78); --side-muted: #9BB5BE; --side-hover: rgba(255, 255, 255, 0.06); --side-selected: rgba(255, 255, 255, 0.11); --side-border: rgba(255, 255, 255, 0.08);
  --accent: #B08A4E; --accent-side: #C9A469; --accent-on: #1F1609; --accent-text: #8A6A35; --accent-soft: #F2EBDD; --accent-soft-ink: #6E521F;
  --knob: #FFFFFF;
  --icon-a: #264F5E; --icon-b: #264F5E; --icon-ink: #FFFFFF;
  --material: rgba(246, 246, 248, 0.78); --material-strong: rgba(250, 250, 252, 0.92); --material-edge: rgba(60, 60, 67, 0.12);
  --scrim: rgba(0, 0, 0, 0.28); --scrim-light: rgba(0, 0, 0, 0.08);
  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.06), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  --shadow-float: 0 10px 40px rgba(0, 0, 0, 0.16), 0 0 0 0.5px rgba(0, 0, 0, 0.08);
  --shadow-seg: 0 2px 6px rgba(0, 0, 0, 0.12), 0 0 0 0.5px rgba(0, 0, 0, 0.04);
  --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.1), 0 0 0 0.5px rgba(0, 0, 0, 0.05);
  --focus: rgba(38, 79, 94, 0.55);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-title: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 28px; --s7: 44px;
  --r-s: 8px; --r: 10px; --r-l: 14px; --r-xl: 20px;
  --side-w: 248px; --tab-h: 58px;
  --sb-rail: 60px;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1); --spring: cubic-bezier(0.2, 0.9, 0.25, 1);
}

  color-scheme: dark;
  --bg: #0B0B0D; --surface: #1C1C1E; --fill: #2C2C2E; --fill-2: #232325;
  --label: #F5F5F7; --label-2: #AEAEB2; --label-3: #8E8E93;
  --separator: #48484A; --separator-soft: #38383A;
  --tint: #8DBCCA; --tint-ink: #0E2129; --tint-soft: #1A3340; --tint-soft-ink: #B9D3DB;
  --green: #32D74B; --green-soft: #17301D; --switch-on: #30D158;
  --orange: #FFA530; --orange-soft: #3A2810;
  --red: #FF6B60; --red-soft: #3D1B19; --red-ink: #2A0806;
  --sms: #30D158; --sms-ink: #04210C; --sms-in: #2C2C2E;
  --side-bg: #13232B; --side-fg: #F1F6F8; --side-text: rgba(230, 238, 241, 0.78); --side-muted: #9BB5BE; --side-hover: rgba(255, 255, 255, 0.06); --side-selected: rgba(255, 255, 255, 0.1); --side-border: rgba(255, 255, 255, 0.07);
  --accent: #C9A469; --accent-side: #C9A469; --accent-on: #1F1609; --accent-text: #D4B37A; --accent-soft: #3A2E1A; --accent-soft-ink: #E8D3AE;
  --knob: #FFFFFF;
  --material: rgba(30, 30, 32, 0.72); --material-strong: rgba(36, 36, 38, 0.9); --material-edge: rgba(255, 255, 255, 0.1);
  --scrim: rgba(0, 0, 0, 0.5); --scrim-light: rgba(0, 0, 0, 0.3);
  --shadow-card: 0 0 0 0.5px rgba(255, 255, 255, 0.06);
  --shadow-float: 0 12px 44px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  --shadow-seg: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  --focus: rgba(141, 188, 202, 0.6);
} }
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B0B0D; --surface: #1C1C1E; --fill: #2C2C2E; --fill-2: #232325;
  --label: #F5F5F7; --label-2: #AEAEB2; --label-3: #8E8E93;
  --separator: #48484A; --separator-soft: #38383A;
  --tint: #8DBCCA; --tint-ink: #0E2129; --tint-soft: #1A3340; --tint-soft-ink: #B9D3DB;
  --green: #32D74B; --green-soft: #17301D; --switch-on: #30D158;
  --orange: #FFA530; --orange-soft: #3A2810;
  --red: #FF6B60; --red-soft: #3D1B19; --red-ink: #2A0806;
  --sms: #30D158; --sms-ink: #04210C; --sms-in: #2C2C2E;
  --side-bg: #13232B; --side-fg: #F1F6F8; --side-text: rgba(230, 238, 241, 0.78); --side-muted: #9BB5BE; --side-hover: rgba(255, 255, 255, 0.06); --side-selected: rgba(255, 255, 255, 0.1); --side-border: rgba(255, 255, 255, 0.07);
  --accent: #C9A469; --accent-side: #C9A469; --accent-on: #1F1609; --accent-text: #D4B37A; --accent-soft: #3A2E1A; --accent-soft-ink: #E8D3AE;
  --knob: #FFFFFF;
  --material: rgba(30, 30, 32, 0.72); --material-strong: rgba(36, 36, 38, 0.9); --material-edge: rgba(255, 255, 255, 0.1);
  --scrim: rgba(0, 0, 0, 0.5); --scrim-light: rgba(0, 0, 0, 0.3);
  --shadow-card: 0 0 0 0.5px rgba(255, 255, 255, 0.06);
  --shadow-float: 0 12px 44px rgba(0, 0, 0, 0.55), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  --shadow-seg: 0 2px 6px rgba(0, 0, 0, 0.4), 0 0 0 0.5px rgba(255, 255, 255, 0.08);
  --shadow-hover: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 0.5px rgba(255, 255, 255, 0.1);
  --focus: rgba(141, 188, 202, 0.6);
}
@media (prefers-contrast: more) { :root { --separator: #8E8E93; --separator-soft: #AEAEB2; --material: var(--surface); --material-strong: var(--surface); } }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; overflow-x: clip; }
body { margin: 0; background: var(--bg); color: var(--label); font: 400 15px/1.45 var(--font); -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--material-strong); }
h1, h2, h3 { margin: 0; color: var(--label); text-wrap: balance; }
h1 { font: 600 30px/1.15 var(--font-title); letter-spacing: -0.01em; }
h2 { font: 600 20px/1.25 var(--font); letter-spacing: -0.02em; }
h3 { font: 600 17px/1.3 var(--font); letter-spacing: -0.015em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
.num { font-variant-numeric: tabular-nums; }
.secondary { color: var(--label-2); }
.footnote { font-size: 13px; color: var(--label-2); }
.caption { font-size: 12px; color: var(--label-2); }
.icon { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; stroke: none; vertical-align: -4px; --w-r: inline; --w-b: none; }
.tag .icon, .closebtn .icon, .icon--s, .check .icon { --w-r: none; --w-b: inline; }
.icon--s { width: 16px; height: 16px; vertical-align: -3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.only-phone, .only-phone-inline { display: none; }

/* ---------- shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; transition: grid-template-columns 240ms cubic-bezier(0.23, 1, 0.32, 1); }
:root[data-side="collapsed"] { --side-w: var(--sb-rail); }
/* Sidebar: matches the app's Sidebar component (header + toggle, labelled sections, gliding active pill, footer), on the MGC ink tone. */
.sidebar { position: sticky; top: 0; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; background: var(--side-bg); color: var(--side-fg); border-right: 1px solid var(--side-border); padding-top: env(safe-area-inset-top, 0px); }
.sb-head { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 12px 0 18px; flex-shrink: 0; }
.sb-head b { font-size: 14px; font-weight: 600; white-space: nowrap; }
.appicon { width: 32px; height: 32px; flex-shrink: 0; border-radius: 8px; display: grid; place-items: center; background: var(--icon-b); color: var(--icon-ink); }
.appicon svg { width: 60%; height: 60%; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: square; stroke-linejoin: miter; }
.sb-head .appicon { width: 28px; height: 28px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
.sb-toggle { margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; flex-shrink: 0; border: 0; border-radius: 10px; background: transparent; color: var(--side-muted); cursor: pointer; transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1), color 150ms ease, background-color 150ms ease; }
.sb-toggle:hover { background: var(--side-hover); color: var(--side-fg); }
.sb-toggle:active { transform: scale(0.96); }
.sb-toggle .icon { width: 17px; height: 17px; vertical-align: 0; }
.is-collapsed .sb-head { justify-content: center; padding: 0; margin: 4px 8px 0; border-radius: 10px; cursor: pointer; border: 0; background: transparent; color: inherit; width: auto; }
.is-collapsed .sb-head:hover { background: var(--side-hover); }
.sb-nav { position: relative; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior-y: contain; padding: 8px 0; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.sb-nav:hover { scrollbar-color: rgba(255, 255, 255, 0.11) transparent; }
.sb-pill { position: absolute; top: 0; left: 8px; right: 8px; height: 34px; border-radius: 10px; background: var(--side-selected); pointer-events: none; opacity: 0; transition: transform 320ms var(--spring), height 320ms var(--spring), opacity 150ms ease; }
.sb-pill.no-anim { transition: none; }
.sb-section { padding: 4px 0; }
.sb-label { display: flex; align-items: flex-end; height: 26px; padding: 0 18px 6px; font-size: 10.5px; font-weight: 500; line-height: 1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--side-muted); white-space: nowrap; transition: opacity 120ms ease; }
.sb-items { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
.sb-item { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 12px; border: 0; border-radius: 10px; background: transparent; color: var(--side-text); font: 500 13.5px/20px var(--font); text-align: left; white-space: nowrap; cursor: pointer; user-select: none; transition: color 150ms cubic-bezier(0.23, 1, 0.32, 1), background-color 150ms cubic-bezier(0.23, 1, 0.32, 1); }
.sb-item:hover { color: var(--side-fg); background: var(--side-hover); }
.sb-item[aria-current="page"] { color: var(--side-fg); }
.sb-item[aria-current="page"]:hover { background: transparent; }
.sb-item .icon { width: 18px; height: 18px; flex-shrink: 0; margin: 1px; vertical-align: 0; color: var(--side-muted); transition: color 150ms ease; }
.sb-item:hover .icon { color: var(--side-fg); }
.sb-item[aria-current="page"] .icon { color: var(--accent-side); }
.sb-text { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; transition: opacity 120ms ease; }
.sb-count, .sb-badge { flex-shrink: 0; padding: 2px 6px; border-radius: 6px; font-size: 10.5px; line-height: 1.2; font-variant-numeric: tabular-nums; transition: opacity 120ms ease; }
.sb-count { background: rgba(255, 255, 255, 0.07); color: var(--side-muted); font-weight: 500; }
.sb-badge { background: var(--accent-side); color: var(--accent-on); font-weight: 600; }
.sb-foot { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding: 12px 12px max(12px, env(safe-area-inset-bottom, 0px)) 18px; border-top: 1px solid var(--side-border); }
.avatar { width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; display: grid; place-items: center; background: var(--accent-side); color: var(--accent-on); font-size: 11px; font-weight: 700; }
.sb-user { min-width: 0; flex: 1; display: grid; gap: 2px; transition: opacity 120ms ease; }
.sb-user b { font-size: 12.5px; font-weight: 500; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-user small { font-size: 11px; line-height: 1.2; color: var(--side-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-switch { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; padding: 4px; margin: -4px; border: 0; border-radius: 10px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
.sb-switch:hover { background: var(--side-hover); }
.sb-switch > .icon { width: 16px; height: 16px; color: var(--side-muted); flex-shrink: 0; }
.sidebar :focus-visible { outline: 2px solid var(--accent-side); outline-offset: 2px; }
.is-collapsed .sb-label, .is-collapsed .sb-text, .is-collapsed .sb-count, .is-collapsed .sb-badge, .is-collapsed .sb-user, .is-collapsed .sb-switch > .icon { opacity: 0; pointer-events: none; }
.is-collapsed .sb-foot { justify-content: center; padding-inline: 0; }
.is-collapsed .sb-switch { flex: 0 0 auto; }
@media (prefers-reduced-motion: reduce) { .app, .sb-pill { transition: none; } }

.main { min-width: 0; display: flex; flex-direction: column; }
.toolbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; flex-wrap: wrap; gap: var(--s3) var(--s4); padding: calc(var(--s4) + env(safe-area-inset-top, 0px)) max(var(--s6), env(safe-area-inset-right, 0px)) var(--s4) var(--s6); background: var(--material); border-bottom: 0.5px solid var(--material-edge); -webkit-backdrop-filter: saturate(180%) blur(24px); backdrop-filter: saturate(180%) blur(24px); }
.toolbar__title { min-width: 0; display: grid; gap: 2px; margin-right: auto; }
.toolbar__actions { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
.view { padding: var(--s6) max(var(--s6), env(safe-area-inset-right, 0px)) 260px var(--s6); display: grid; gap: var(--s6); align-content: start; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 var(--s4); border: 0; border-radius: 999px; background: var(--fill); color: var(--tint); font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: filter 120ms var(--ease), transform 120ms var(--ease); }
.btn:hover { filter: brightness(0.95); }
.btn:active { transform: scale(0.97); filter: brightness(0.88); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; filter: none; }
.btn--prominent { background: var(--tint); color: var(--tint-ink); font-weight: 600; }
.btn--danger { background: var(--red); color: var(--red-ink); font-weight: 600; }
.btn--destructive { color: var(--red); }
.btn--plain { background: transparent; padding: 0 var(--s2); }
.btn--plain:hover { background: var(--fill); filter: none; }
.btn--sm { min-height: 30px; padding: 0 var(--s3); font-size: 13px; }
.btn--icon { width: 36px; padding: 0; }
@media (pointer: coarse) { .btn { min-height: 44px; } .btn--sm { min-height: 36px; } .btn--icon { width: 44px; } }

.menu { position: relative; }
.menu__list { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; width: 270px; padding: 5px; margin: 0; list-style: none; background: var(--material-strong); border-radius: var(--r-l); box-shadow: var(--shadow-float); -webkit-backdrop-filter: saturate(180%) blur(30px); backdrop-filter: saturate(180%) blur(30px); animation: pop 180ms var(--spring); transform-origin: top right; }
@keyframes pop { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
.menu__list button { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 48px; padding: var(--s2) var(--s3); border: 0; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; }
.menu__list button .icon { color: var(--tint); }
.menu__list button:hover { background: var(--fill); }
.menu__list span { display: grid; }
.menu__list small { color: var(--label-2); font-size: 12px; }

.seg { display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 2px; border-radius: 9px; background: var(--fill); }
.seg button { min-height: 28px; padding: 0 var(--s4); border: 0; border-radius: 7px; background: transparent; color: var(--label); font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow-seg); font-weight: 600; }
@media (pointer: coarse) { .seg button { min-height: 36px; } }

.tag { display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--fill); color: var(--label-2); }
.tag .icon { width: 12px; height: 12px; vertical-align: 0; }
.tag--tint { background: var(--tint-soft); color: var(--tint-soft-ink); }
.tag--green { background: var(--green-soft); color: var(--green); }
.tag--orange { background: var(--orange-soft); color: var(--orange); }
.tag--red { background: var(--red-soft); color: var(--red); }

/* grouped content */
.group { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-card); overflow: hidden; }
.group__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3); padding: var(--s4) var(--s5) var(--s2); }
.group__body { padding: var(--s2) var(--s5) var(--s5); }
.section-title { padding: 0 var(--s4) var(--s2); font-size: 13px; color: var(--label-2); }
.rows { margin: 0; padding: 0; list-style: none; }
.row { display: flex; align-items: center; gap: var(--s3); width: 100%; min-height: 60px; padding: var(--s3) var(--s4); border: 0; background: transparent; text-align: left; cursor: pointer; position: relative; }
.rows > li + li > .row::before { content: ""; position: absolute; top: 0; left: var(--s4); right: 0; border-top: 0.5px solid var(--separator); }
.row:hover { background: var(--fill-2); }
.row__main { min-width: 0; flex: 1; display: grid; gap: 1px; }
.row__main b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__main span { font-size: 13px; color: var(--label-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row__end { display: grid; justify-items: end; gap: 4px; flex-shrink: 0; }
.chev { color: var(--label-3); }

/* summary tiles */
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--s3); }
.tile { display: grid; gap: 2px; padding: var(--s4); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow-card); }
.tile span { font-size: 13px; color: var(--label-2); }
.tile b { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

/* board */
.board-wrap { overflow-x: auto; margin-inline: calc(-1 * var(--s6)); padding: 0 var(--s6) var(--s3); scroll-snap-type: x proximity; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: var(--s3); min-width: min-content; }
.col { display: flex; flex-direction: column; gap: var(--s2); min-height: 440px; padding: var(--s3); background: var(--fill); border-radius: var(--r-l); scroll-snap-align: start; transition: background-color 150ms var(--ease), box-shadow 150ms var(--ease); }
.col.is-over, .lostbar.is-over { box-shadow: inset 0 0 0 2px var(--tint); background: var(--tint-soft); }
.col__head { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s2); padding: 2px var(--s1) var(--s1); }
.col__head b { font-size: 13px; font-weight: 600; }
.col__head span { font-size: 12px; color: var(--label-2); }
.card { display: grid; gap: 6px; width: 100%; padding: var(--s3); background: var(--surface); border: 0; border-radius: var(--r); text-align: left; cursor: pointer; box-shadow: var(--shadow-card); transition: transform 150ms var(--ease), box-shadow 150ms var(--ease); }
.card:hover { box-shadow: var(--shadow-hover); }
.card:active { transform: scale(0.985); }
.card.is-new { animation: arrive 700ms var(--spring); }

<script>
(() => {
'use strict';
const STAGES = [
  { id: 'new', label: 'New Enquiry', next: 'Call within the hour' },
  { id: 'contacted', label: 'Contacted', next: 'Book a consultation' },
  { id: 'consult', label: 'Consultation', next: 'Attorney review, then send the contract' },
  { id: 'contract', label: 'Contract Sent', next: 'Waiting for signature' },
  { id: 'signed', label: 'Signed', next: 'Open the matter and start work' },
  { id: 'delivered', label: 'Services Provided', next: 'Closed' },
];
const STAGE = Object.fromEntries(STAGES.map((s, i) => [s.id, { ...s, i }]));
const SOURCES = { web: 'Website Form', email: 'Email', text: 'Text Message', manual: 'Phone Call', referral: 'Referral', ads: 'Google Ads' };
const OWNERS = ['Sarah Mitchell', 'David Cohen', 'Priya Nair', 'James Okafor'];
const LOST_REASONS = ['Went with another firm', 'Could not afford the fee', 'Outside our practice areas', 'No response after follow-up', 'Conflict of interest'];
const POOL = [
  { name: 'Carmen Ortiz', matter: 'Custody modification', practice: 'Family law', value: 5500 },
  { name: 'Kevin Huang', matter: 'Car accident injury claim', practice: 'Personal injury', value: 24000 },
  { name: 'Amara Okoye', matter: 'H-1B transfer', practice: 'Immigration', value: 4800 },
  { name: 'Brian Walsh', matter: 'Trust and will package', practice: 'Estate planning', value: 3200 },
  { name: 'Nadia Rahman', matter: 'Unpaid overtime claim', practice: 'Employment', value: 12000 },
  { name: 'Luis Moreno', matter: 'DUI defense', practice: 'Criminal defense', value: 7500 },
  { name: 'Grace Kim', matter: 'LLC formation', practice: 'Business law', value: 2500 },
  { name: 'Owen Price', matter: 'Uncontested divorce', practice: 'Family law', value: 3800 },
];
const FIRM_NUMBER = '(555) 010-0142';
const FIRM_DOMAIN = 'examplefamilylaw.com';
const HOUR = 3600e3, DAY = 24 * HOUR;
const dayAt = (d, hh, mm) => { const x = new Date(); x.setDate(x.getDate() + d); x.setHours(hh, mm, 0, 0); return +x; };
const endOfToday = () => { const x = new Date(); x.setHours(23, 59, 59, 999); return +x; };
const FIRMS = ['Example Family Law LLP', 'Harbor Injury Group', 'Northside Immigration Law'];
const phoneNum = () => '(555) 01' + Math.floor(Math.random() * 10) + '-' + Math.floor(Math.random() * 9000 + 1000);

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, cls) => '<svg class="icon' + (cls ? ' ' + cls : '') + '" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');
const ago = (t) => { const d = Date.now() - t; if (d < 60e3) return 'Just now'; if (d < HOUR) return Math.round(d / 60e3) + ' min ago'; if (d < DAY) return Math.round(d / HOUR) + ' hr ago'; return Math.round(d / DAY) + ' days ago'; };
const when = (t) => { const d = new Date(t); const today = new Date(); const s = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }); if (d.toDateString() === today.toDateString()) return 'Today, ' + s; const tm = new Date(today.getTime() + DAY); if (d.toDateString() === tm.toDateString()) return 'Tomorrow, ' + s; return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ', ' + s; };
const first = (n) => n.split(' ')[0];
const slug = (n) => n.toLowerCase().replace(/[^a-z]+/g, '.');
const uid = () => Math.random().toString(36).slice(2, 9);
const isPhone = () => matchMedia('(max-width: 760px)').matches;

/* ---------- state ---------- */
let S;
function seed() {
  const now = Date.now();
  const mk = (o) => {
    const l = { id: uid(), email: slug(o.name) + '@example.com', phone: phoneNum(), owner: OWNERS[Math.floor(Math.random() * 4)], created: now - (o.age || 1) * DAY, activities: [], doc: null, lostReason: null, ...o };
    l.activities.push({ t: l.created, type: 'enquiry', cls: '', title: 'Enquiry received', text: 'Came in by ' + SOURCES[l.source].toLowerCase() + '.' });
    return l;
  };
  const leads = [
    mk({ name: 'Rachel Greene', matter: 'Contested divorce and custody', practice: 'Family law', source: 'ads', value: 6500, stage: 'new', age: 0.1 }),
    mk({ name: 'Marcus Webb', matter: 'Slip and fall injury', practice: 'Personal injury', source: 'referral', value: 28000, stage: 'new', age: 0.4 }),
    mk({ name: 'Tom Alvarez', matter: 'LLC formation', practice: 'Business law', source: 'referral', value: 2500, stage: 'contacted', age: 4 }),
    mk({ name: 'Elena Petrova', matter: 'Work visa to green card', practice: 'Immigration', source: 'web', value: 4200, stage: 'contacted', age: 3 }),
    mk({ name: 'Hannah Lee', matter: 'Will and living trust', practice: 'Estate planning', source: 'web', value: 3500, stage: 'consult', age: 6 }),
    mk({ name: 'Omar Haddad', matter: 'DUI defense', practice: 'Criminal defense', source: 'ads', value: 9000, stage: 'consult', age: 5 }),
    mk({ name: 'Linda Park', matter: 'Wrongful termination', practice: 'Employment', source: 'web', value: 15000, stage: 'contract', age: 9 }),
    mk({ name: 'Sofia Reyes', matter: 'Divorce settlement', practice: 'Family law', source: 'referral', value: 8000, stage: 'signed', age: 14 }),
    mk({ name: 'Daniel Brooks', matter: 'Premises liability claim', practice: 'Personal injury', source: 'referral', value: 30000, stage: 'delivered', age: 40 }),
    mk({ name: 'Gary Nolan', matter: 'Commercial lease review', practice: 'Business law', source: 'ads', value: 2000, stage: 'lost', age: 12, lostReason: 'Went with another firm' }),
  ];
  leads.forEach((l) => {
    const i = l.stage === 'lost' ? 1 : STAGE[l.stage].i;
    if (i >= 1) l.activities.push({ t: l.created + 2 * HOUR, type: 'call', cls: '', title: 'Call logged by ' + l.owner, text: 'Discussed the matter and next steps.' });
    if (i >= 2) l.activities.push({ t: l.created + DAY, type: 'meeting', cls: '', title: 'Consultation held', text: 'Attorney review completed.' });
    if (i >= 3) { l.doc = { status: 'sent', sent: l.created + 2 * DAY }; l.activities.push({ t: l.doc.sent, type: 'doc', cls: 'auto', title: 'Engagement letter sent', text: 'By email and text link.' }); }
    if (i >= 4) { l.doc.status = 'signed'; l.doc.signed = l.created + 3 * DAY; l.doc.by = l.name; l.activities.push({ t: l.doc.signed, type: 'signed', cls: 'good', title: 'Signed by ' + l.name, text: 'Stage moved to Signed automatically.' }); }
    if (i >= 5) l.activities.push({ t: l.created + 30 * DAY, type: 'stage', cls: 'good', title: 'Services provided', text: 'Matter closed.' });
    if (l.stage === 'lost') l.activities.push({ t: l.created + 5 * DAY, type: 'lost', cls: 'bad', title: 'Marked as lost', text: 'Reason: ' + l.lostReason + '.' });
    l.next = nextFor(l);
  });
  return {
    view: 'dashboard', open: null, modal: null, menu: false, filter: { leads: 'all', inbox: 'all', contacts: 'all' },
    collapsed: false, done: {},
    events: [
      { t: dayAt(3, 10, 0), title: 'Intake team weekly review', who: 'Whole intake team' },
      { t: dayAt(4, 14, 30), title: 'Marketing check-in with MGC', who: 'Sarah Mitchell' },
      { t: dayAt(6, 9, 30), title: 'Lead source review', who: 'David Cohen' },
    ],
    integrations: [
      { id: 'web', name: 'Website Form', icon: 'globe', on: true, desc: 'Enquiries from your website arrive as leads and get the instant reply.' },
      { id: 'ads', name: 'Google Ads', icon: 'bolt', on: true, desc: 'Lead form and call ads come in tagged with the campaign they came from.' },
      { id: 'gcal', name: 'Google Calendar', icon: 'calendar', on: false, desc: 'Consultations and follow-ups appear on each attorney’s calendar.' },
      { id: 'outlook', name: 'Microsoft Outlook', icon: 'mail', on: false, desc: 'Sync calendars and keep email threads on the lead’s timeline.' },
      { id: 'calls', name: 'Call Tracking', icon: 'phone', on: false, desc: 'Tracked calls become leads, with the number and source attached.' },
      { id: 'clio', name: 'Clio', icon: 'arrow', on: false, desc: 'Signed clients are sent to Clio as new matters, so nobody types them twice.' },
    ],
    firm: { name: 'Example Family Law LLP', domainStatus: 'unverified', textStatus: 'unregistered' },
    leads,
    campaigns: [
      { id: 'c1', name: 'Instant Reply', trigger: 'A new enquiry arrives', channel: 'Text', steps: 1, active: true, sent: 0, body: 'Hi {first}, thanks for contacting Example Family Law. An attorney will call you today. Reply STOP to opt out.' },
      { id: 'c2', name: 'New Enquiry Welcome', trigger: 'A new enquiry arrives', channel: 'Email', steps: 3, active: true, sent: 0, body: 'Hi {first},\n\nThank you for reaching out about your {matter}. Here is what happens next, and what to bring to your consultation.' },
      { id: 'c3', name: 'Consultation Reminder', trigger: 'A consultation is booked', channel: 'Text and Email', steps: 2, active: true, sent: 0, body: 'Hi {first}, a reminder of your consultation tomorrow. Reply C to confirm.' },
      { id: 'c4', name: 'Signature Follow-Up', trigger: 'A contract is unsigned after 2 days', channel: 'Text', steps: 2, active: true, sent: 0, body: 'Hi {first}, your engagement letter is ready to sign: sign.example.com/abc' },
      { id: 'c5', name: 'Monthly Newsletter', trigger: 'The first Monday of the month', channel: 'Email', steps: 1, active: false, sent: 0, body: 'News and updates from Example Family Law.' },
    ],
    tour: { step: 0, min: isPhone(), leadId: null, dismissed: false },
    fresh: null,
  };
}
function nextFor(l) {
  if (l.stage === 'lost') return { text: 'Closed as lost', due: null };
  const base = Date.now();
  const due = { new: base + HOUR, contacted: base + DAY, consult: base + 2 * DAY, contract: base + 2 * DAY }[l.stage] || null;
  return { text: STAGE[l.stage].next, due };
}

function sheet(m) {
  const l = m.id ? lead(m.id) : null;
  const head = (t, sub) => '<span class="grabber" aria-hidden="true"></span><div class="sheet-head"><div class="sheet-head__title"><h2 id="m-title">' + t + '</h2>' + (sub ? '<span class="footnote">' + sub + '</span>' : '') + '</div><button class="closebtn" type="button" data-action="close-modal" aria-label="Cancel">' + ic('x') + '</button></div>';
  const foot = (primary, danger) => '<div class="sheet__foot"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn ' + (danger ? 'btn--danger' : 'btn--prominent') + '" type="submit">' + primary + '</button></div>';
  if (m.type === 'intake') return '<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" data-form="intake">' + head('Quick Intake', 'Log a phone call or walk-in as a new lead.') +
    '<div class="sheet__body"><div class="formgroup"><div class="field"><label for="qi-name">Name</label><input id="qi-name" name="name" required autofocus autocomplete="off" value="Priya Shah"></div><div class="field"><label for="qi-phone">Phone</label><input id="qi-phone" name="phone" type="tel" inputmode="tel" value="(555) 014-2290"></div>' +
    '<div class="field"><label for="qi-practice">Practice Area</label><select id="qi-practice" name="practice"><option>Family law</option><option>Personal injury</option><option>Immigration</option><option>Estate planning</option><option>Employment</option><option>Criminal defense</option><option>Business law</option></select></div><div class="field"><label for="qi-value">Estimated Fee</label><input id="qi-value" name="value" inputmode="numeric" value="4500"></div><div class="field"><label for="qi-matter">Matter</label><input id="qi-matter" name="matter" value="Child support review"></div></div>' +
    '<div class="formgroup"><div class="field field--stack"><label for="qi-note">Call Notes</label><textarea id="qi-note" name="note">Called the front desk. Wants to adjust child support after a job change.</textarea></div></div></div>' + foot('Create Lead') + '</form>';
  if (m.type === 'compose') return '<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" data-form="compose" data-id="' + l.id + '">' + head('Text ' + esc(first(l.name)), 'From ' + FIRM_NUMBER) +
    '<div class="sheet__body">' + (canText() ? '' : '<p class="hint hint--warn">Your texting number is not registered yet, so this text will be held.</p>') + '<div class="formgroup"><div class="field field--stack"><label for="tx" class="vh">Message</label><textarea id="tx" name="body" autofocus>Hi ' + esc(first(l.name)) + ', this is ' + esc(first(l.owner)) + ' from Example Family Law. Is now a good time for a quick call about your ' + esc(l.matter.toLowerCase()) + '?</textarea></div></div></div>' + foot('Send Text') + '</form>';
  if (m.type === 'reminder') return '<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" data-form="reminder" data-id="' + l.id + '">' + head('Add Reminder', 'It appears on ' + esc(first(l.owner)) + '’s agenda.') +
    '<div class="sheet__body"><div class="formgroup"><div class="field"><label for="rm-t">Reminder</label><input id="rm-t" name="title" autofocus value="Follow up with ' + esc(first(l.name)) + '"></div><div class="field"><label for="rm-w">When</label><select id="rm-w" name="when"><option value="3">In 3 hours</option><option value="24" selected>Tomorrow</option><option value="72">In 3 days</option></select></div></div></div>' + foot('Add Reminder') + '</form>';
  if (m.type === 'lost') return '<form class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title" data-form="lost" data-id="' + l.id + '">' + head('Mark ' + esc(first(l.name)) + ' as Lost', 'The reason is kept, so reports can show why leads are lost.') +
    '<div class="sheet__body"><div class="formgroup"><div class="field"><label for="lr">Reason</label><select id="lr" name="reason" autofocus>' + LOST_REASONS.map((r) => '<option>' + r + '</option>').join('') + '</select></div></div><p class="hint">You can reopen the lead later.</p></div>' + foot('Mark as Lost', true) + '</form>';
  if (m.type === 'client') {
    const signed = l.doc?.status === 'signed';
    return '<form class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="m-title" data-form="sign" data-id="' + l.id + '">' + head('What ' + esc(first(l.name)) + ' Sees', 'A text with a link, then the letter to sign on any device.') +
      '<div class="sheet__body client"><div class="messages"><p class="messages__from"><b>Example Family Law</b>Text Message, Today</p><p class="bubble">Hi ' + esc(first(l.name)) + ', your engagement letter from Example Family Law is ready to sign: <a href="#" data-action="noop">sign.example.com/' + l.id + '</a></p>' + (signed ? '<p class="bubble bubble--out">Signed, thank you!</p>' : '') + '<p class="caption" style="text-align:center">Also sent by email from intake@' + FIRM_DOMAIN + '</p></div>' +
      '<div class="letter"><span class="caption">Example Family Law LLP</span><h3>Engagement Letter</h3><p>This letter confirms that Example Family Law LLP will represent ' + esc(l.name) + ' in the matter of ' + esc(l.matter.toLowerCase()) + '. The estimated fee is ' + money(l.value) + ', billed as described in the attached fee schedule.</p>' +
      (signed ? '<span class="signed">' + ic('check') + 'Signed by ' + esc(l.doc.by) + '</span>' : '<div class="sig"><label for="sig" class="footnote">Type your full name to sign</label><input id="sig" name="sig" autocomplete="off" required autofocus value="' + esc(l.name) + '"></div>') + '</div></div>' +
      '<div class="sheet__foot">' + (signed ? '<button class="btn btn--prominent" type="button" data-action="close-modal">Done</button>' : '<button class="btn" type="button" data-action="close-modal">Not Now</button><button class="btn btn--prominent" type="submit">Sign as ' + esc(first(l.name)) + '</button>') + '</div></form>';
  }
  const plain = (t, sub, body) => '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">' + head(t, sub) + '<div class="sheet__body">' + body + '</div></div>';
  const rowBtn = (attrs, icon, t, sub, end) => '<li><button type="button" class="row" ' + attrs + '>' + ic(icon) + '<span class="row__main"><b>' + t + '</b>' + (sub ? '<span>' + sub + '</span>' : '') + '</span>' + (end || ic('chev', 'icon--s chev')) + '</button></li>';
  if (m.type === 'more') return plain('More', '', '<ul class="group rows">' + VIEWS.filter((x) => !TABS.includes(x.id)).map((x) => rowBtn('data-action="view" data-view="' + x.id + '"', x.icon, x.label, esc(x.sub))).join('') + rowBtn('data-action="help"', 'help', 'Help and Resources', 'The demo tour, setup guide and support') + '</ul>');
  if (m.type === 'help') return plain('Help and Resources', 'Demo data only. Nothing is sent.', '<ul class="group rows">' +
    rowBtn('data-action="tour-restart"', 'arrow', 'Take the Demo Tour', 'Seven steps, from firm onboarding to reports') +
    rowBtn('data-action="view" data-view="setup"', 'gear', 'Firm Setup Guide', 'Verify your email domain and register texting') +
    rowBtn('data-action="support"', 'messages', 'Contact MGC Support', 'We reply within one business day') +
    rowBtn('data-action="reset"', 'bolt', 'Reset Demo Data', 'Start again with the sample firm') + '</ul>');
  if (m.type === 'firms') return plain('Switch Firm', 'MGC staff can move between the firms they manage.', '<ul class="group rows">' +
    FIRMS.map((f) => rowBtn('data-action="firm" data-name="' + esc(f) + '"' + (f === S.firm.name ? ' aria-current="true"' : ''), 'contacts', esc(f), f === S.firm.name ? 'Current firm' : '', f === S.firm.name ? '<span class="tag tag--green">' + ic('check') + 'Current</span>' : '')).join('') + '</ul><p class="hint">In this demo every firm shows the same sample data.</p>');
  return '';
}

/* ---------- tour ---------- */
const TOUR = [
  { title: 'Onboard the Firm', body: 'Each firm sends from its own domain and number. Verify the email domain, then register texting with US carriers.', go: 'Do It for Me', done: () => canEmail() && canText(),
    run: async () => { S.view = 'setup'; render(); if (!canEmail()) { verifyDomain(); await wait(1700); } if (!canText()) { S.firm.textStatus = 'review'; render(); await wait(900); approveText(); } } },
  { title: 'An Enquiry Arrives', body: 'A visitor fills in the website form. The lead is created, assigned, and gets an instant text reply from the firm’s number.', go: 'Send an Enquiry', done: () => !!S.tour.leadId,
    run: () => { S.view = 'pipeline'; const l = createLead('web'); S.tour.leadId = l.id; render(); setTimeout(() => { S.open = l.id; render(); }, 700); } },
  { title: 'The Team Works It', body: 'The owner calls, then books a consultation. Each stage books its next step, and the reminder goes out by text and email.', go: 'Call and Book', done: () => { const l = lead(S.tour.leadId); return l && STAGE[l.stage] && STAGE[l.stage].i >= 2; },
    run: async () => { const l = tourLead(); if (!l) return; S.open = l.id; if (l.stage === 'new') { logCall(l); render(); await wait(900); } setStage(l, 'consult'); render(); } },
  { title: 'The Contract Goes Out', body: 'After attorney review, the engagement letter is sent by email and text link. The lead moves to Contract Sent.', go: 'Send the Letter', done: () => { const l = lead(S.tour.leadId); return l && STAGE[l.stage] && STAGE[l.stage].i >= 3; },
    run: () => { const l = tourLead(); if (!l) return; if (STAGE[l.stage].i < 2) setStage(l, 'consult', true); sendContract(l); S.open = l.id; render(); } },
  { title: 'The Client Signs', body: 'This is the client’s side. They tap the link and sign on their phone. The stage updates by itself, nobody moves the card.', go: 'Show the Client’s View', done: () => { const l = lead(S.tour.leadId); return l && l.doc?.status === 'signed'; },
    run: () => { const l = tourLead(); if (!l) return; if (!l.doc) sendContract(l); S.open = l.id; S.modal = { type: 'client', id: l.id }; render(); } },
  { title: 'Services Provided', body: 'The work is delivered and the matter is closed. Any lead can also be marked as lost, with a reason.', go: 'Close the Matter', done: () => { const l = lead(S.tour.leadId); return l && l.stage === 'delivered'; },
    run: () => { const l = tourLead(); if (!l) return; if (l.doc?.status !== 'signed') { if (!l.doc) sendContract(l); signContract(l, l.name); } setStage(l, 'delivered'); S.modal = null; S.open = l.id; render(); } },
  { title: 'Prove What Converts', body: 'Reports update as you work: leads by source, what signed, and why leads were lost.', go: 'Open Reports', done: () => S.view === 'reports' && S.tour.step === 6,
    run: () => { S.open = null; S.modal = null; S.view = 'reports'; render(); } },
];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
function tourLead() { let l = lead(S.tour.leadId); if (!l) { l = createLead('web'); S.tour.leadId = l.id; } return l; }
function renderTour() {
  const T = document.getElementById('tour');
  if (S.tour.dismissed || (S.tour.min && isPhone() && (S.open || S.modal))) { T.hidden = true; return; }
  T.hidden = false;
  const i = S.tour.step, st = TOUR[i];
  T.className = 'tour' + (S.tour.min ? ' is-min' : '');
  T.innerHTML = '<div class="tour__head"><b>Demo Tour, Step ' + (i + 1) + ' of ' + TOUR.length + '</b><div style="display:flex;gap:2px;align-items:center"><button class="btn btn--plain btn--sm" type="button" data-action="tour-min" aria-expanded="' + !S.tour.min + '">' + (S.tour.min ? 'Show' : 'Hide') + '</button><button class="closebtn" type="button" data-action="tour-close" aria-label="Close tour">' + ic('x') + '</button></div></div>' +
    '<div class="tour__body"><div class="tour__dots" aria-hidden="true">' + TOUR.map((t, k) => '<span class="' + (k === i ? 'now' : t.done() ? 'done' : '') + '"></span>').join('') + '</div>' +
    '<p class="tour__title">' + esc(st.title) + (st.done() ? ' <span class="tag tag--green" style="vertical-align:middle">' + ic('check') + 'Done</span>' : '') + '</p><p class="footnote">' + esc(st.body) + '</p>' +
    '<div class="tour__nav"><button class="btn btn--sm" type="button" data-action="tour-prev"' + (i === 0 ? ' disabled' : '') + '>Back</button>' +
    (st.done() && i < TOUR.length - 1 ? '<button class="btn btn--prominent btn--sm" type="button" data-action="tour-next">Next Step</button>' : i === TOUR.length - 1 && st.done() ? '<button class="btn btn--sm" type="button" data-action="reset">Start Over</button>' : '<button class="btn btn--prominent btn--sm" type="button" data-action="tour-run">' + esc(st.go) + '</button>') + '</div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-action]');
  if (!b) { if (S.menu && !e.target.closest('.menu')) { S.menu = false; render(); } return; }
  const a = b.dataset.action, id = b.dataset.id, l = id ? lead(id) : null;
  if (a !== 'toggle-menu' && S.menu) S.menu = false;
  switch (a) {
    case 'noop': e.preventDefault(); return;
    case 'view': S.view = b.dataset.view; S.open = null; S.modal = null; window.scrollTo(0, 0); break;
    case 'filter': S.filter[b.dataset.key] = b.dataset.val; break;
    case 'toggle-menu': S.menu = !S.menu; break;
    case 'enquiry': S.view = 'pipeline'; createLead(b.dataset.channel); break;
    case 'quick-intake': S.modal = { type: 'intake' }; break;
    case 'open': S.open = id; break;
    case 'close': S.open = null; break;
    case 'close-modal': S.modal = null; break;
    case 'log-call': logCall(l); break;
    case 'stage': setStage(l, b.dataset.stage); break;
    case 'send-contract': sendContract(l); break;
    case 'client-view': S.modal = { type: 'client', id }; break;
    case 'compose': S.modal = { type: 'compose', id }; break;
    case 'reminder': S.modal = { type: 'reminder', id }; break;
    case 'lost': S.modal = { type: 'lost', id }; break;
    case 'toggle-camp': { const c = S.campaigns.find((x) => x.id === id); c.active = !c.active; toast(c.name + (c.active ? ' turned on' : ' turned off')); break; }
    case 'verify-domain': verifyDomain(); return;
    case 'register-text': S.firm.textStatus = 'review'; toast('Registration submitted', 'Carriers usually take days to weeks'); break;
    case 'approve-text': approveText(); return;
    case 'reset': { const c = S.collapsed; S = seed(); S.collapsed = c; toast('Demo reset'); break; }
    case 'side-toggle': S.collapsed = !S.collapsed; break;
    case 'more': S.modal = { type: 'more' }; break;
    case 'help': S.modal = { type: 'help' }; break;
    case 'firms': S.modal = { type: 'firms' }; break;
    case 'firm': if (b.dataset.name !== S.firm.name) { S.firm.name = b.dataset.name; toast('Switched to ' + b.dataset.name, 'Same sample data in this demo'); } S.modal = null; break;
    case 'support': S.modal = null; toast('Message sent to MGC support', 'We reply within one business day'); break;
    case 'tour-restart': S.modal = null; S.open = null; S.tour = { ...S.tour, step: 0, min: false, dismissed: false }; break;
    case 'task-done': { if (isDone(l)) { delete S.done[l.id]; } else { S.done[l.id] = l.next.due; log(l, { type: 'stage', cls: 'good', title: 'Task done: ' + l.next.text, text: 'Ticked off by ' + l.owner + '.' }); toast('Task done', l.next.text + ', ' + l.name); } break; }
    case 'integ': { const x = S.integrations.find((i) => i.id === id); x.on = !x.on; toast(x.name + (x.on ? ' connected' : ' disconnected'), x.on ? 'Demo only, no account is linked' : ''); break; }
    case 'tour-min': S.tour.min = !S.tour.min; break;
    case 'tour-close': S.tour.dismissed = true; break;
    case 'tour-prev': S.modal = null; S.tour.step = Math.max(0, S.tour.step - 1); break;
    case 'tour-next': S.modal = null; S.tour.step = Math.min(TOUR.length - 1, S.tour.step + 1); break;
    case 'tour-run': { b.disabled = true; await TOUR[S.tour.step].run(); if (S.tour.step === TOUR.length - 1) { render(); return; } break; }
  }
  render();
});
document.addEventListener('submit', (e) => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)); const l = f.dataset.id ? lead(f.dataset.id) : null;
  switch (f.dataset.form) {
    case 'intake': { if (!d.name.trim()) return; const n = createLead('manual', { name: d.name.trim(), phone: d.phone, practice: d.practice, matter: d.matter || d.practice, value: +String(d.value).replace(/\D/g, '') || 3000, note: d.note }); S.modal = null; S.view = 'pipeline'; S.open = n.id; break; }
    case 'compose': if (canText()) { log(l, { type: 'text', title: 'Text sent by ' + l.owner, text: 'From ' + FIRM_NUMBER + '.', quote: d.body }); toast('Text sent to ' + first(l.name), 'From ' + FIRM_NUMBER); } else { log(l, { type: 'text', cls: 'bad', title: 'Text held', text: 'Your texting number is not registered yet.', quote: d.body }); toast('Text held', 'Register your number in Settings'); } S.modal = null; break;
    case 'reminder': { const t = Date.now() + (+d.when) * HOUR; l.next = { text: d.title, due: t }; log(l, { type: 'reminder', title: 'Reminder added: ' + d.title, text: 'Due ' + when(t) + ', on ' + l.owner + '’s agenda.' }); toast('Reminder added', when(t)); S.modal = null; break; }
    case 'lost': l.lostReason = d.reason; setStage(l, 'lost', true); log(l, { type: 'lost', cls: 'bad', title: 'Marked as lost', text: 'Reason: ' + d.reason + '.' }); l.next = nextFor(l); toast(l.name + ' marked as lost', d.reason); S.modal = null; break;
    case 'sign': if (!(d.sig || '').trim()) return; signContract(l, d.sig.trim()); break;
  }
  render();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.modal) S.modal = null; else if (S.open) S.open = null; else if (S.menu) S.menu = false; else return; render(); } });

/* drag and drop on the board */
let dragId = null;
document.addEventListener('dragstart', (e) => { const c = e.target.closest('.card'); if (!c) return; dragId = c.dataset.id; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
document.addEventListener('dragover', (e) => { const z = e.target.closest('[data-drop]'); if (!z || !dragId) return; e.preventDefault(); document.querySelectorAll('.is-over').forEach((x) => x !== z && x.classList.remove('is-over')); z.classList.add('is-over'); });
document.addEventListener('dragleave', (e) => { const z = e.target.closest('[data-drop]'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('is-over'); });
document.addEventListener('drop', (e) => {
  const z = e.target.closest('[data-drop]'); if (!z || !dragId) return; e.preventDefault();
  const l = lead(dragId); dragId = null; const to = z.dataset.drop;
  if (to === 'lost') S.modal = { type: 'lost', id: l.id };
  else if (to === 'signed' && l.doc?.status !== 'signed') { if (!l.doc) sendContract(l); S.modal = { type: 'client', id: l.id }; toast('Clients sign for themselves', 'Here is what they see'); }
  else setStage(l, to);
  render();
});
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.is-over').forEach((x) => x.classList.remove('is-over')); });
matchMedia('(max-width: 760px)').addEventListener('change', () => render());

S = seed();
render();
})();
</script>
</body>
</html>
